<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>StyleCam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#f9f9f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Roboto",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}button:active{opacity:.7}.app{height:100dvh;min-height:480px;display:flex;flex-direction:column;background:#050505;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.header{flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:4px 19px;z-index:3}.hdr-logo{font-size:10px;font-weight:800;letter-spacing:3px;opacity:.66}.hdr-btn{width:45px;height:45px;display:flex;justify-content:center;align-items:center;font-size:23px;color:#fff}
.view{position:relative;flex:1;min-height:180px;overflow:hidden;background:#181818;touch-action:pan-y}#preview{width:100%;height:100%;display:block;object-fit:cover}#vid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.gradient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.13),transparent 28%,transparent 68%,rgba(0,0,0,.42))}
.view-top{position:absolute;top:17px;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:40px;padding:9px 15px;background:rgba(0,0,0,.38);backdrop-filter:blur(14px);letter-spacing:2.4px;font-size:9px;font-weight:700}
.grid{position:absolute;inset:0;display:none;pointer-events:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.grid.on{display:grid}.grid i{border:0;border-right:1px solid rgba(255,255,255,.33);border-bottom:1px solid rgba(255,255,255,.33)}.grid i:nth-child(3n){border-right:0}.grid i:nth-last-child(-n+3){border-bottom:0}
.foc{position:absolute;width:65px;height:65px;border:1px solid #f6dc91;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:0 0 8px #2223}
.offline{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;background:linear-gradient(145deg,#151a1b,#3a2f26,#101013)}.offline b{font-size:19px;font-weight:600}.offline p{font-size:12px;max-width:230px;opacity:.7;line-height:1.6}.retry{border:1px solid #fff6;padding:11px 25px;border-radius:99px}
.look{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);letter-spacing:3px;font-size:15px;font-weight:650;text-shadow:0 1px 7px #0009}
.zooms{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:3px;border-radius:40px;background:rgba(10,10,10,.56);backdrop-filter:blur(12px);padding:4px}.zooms button{min-width:33px;height:33px;border-radius:50%;font-size:12px;color:#fffc}.zooms button.sel{background:rgba(245,245,245,.94);color:#111;font-weight:700}
.style-toggle{position:absolute;bottom:19px;right:17px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.48);border:1px solid #ffffff77;font-size:22px}
.dock{height:180px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 24px 3px}.shoot{display:flex;align-items:center;justify-content:space-between;height:90px}.thumb,.flip{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.thumb{border:1px solid #666;background:linear-gradient(125deg,#a9a08f,#423a36);font-size:24px}.flip{font-size:26px}.shutter{width:73px;height:73px;border:4px solid white;border-radius:100%;display:grid;place-items:center;padding:4px}.shutter div{border-radius:100%;background:#fff;width:100%;height:100%}.mode{text-align:center;font-weight:600;letter-spacing:2px;font-size:11px;display:flex;justify-content:center;gap:28px;color:#6f6d6b}.mode .on{color:#f8d16e}.style-open{margin:auto;display:flex;align-items:center;gap:10px;letter-spacing:2px;font-size:10px;color:#ddd}.swatch{height:21px;width:21px;border:2px solid #fff8;border-radius:6px;background:linear-gradient(135deg,#f4d49c,#463f60)}
.sheet{position:absolute;z-index:10;left:0;right:0;bottom:0;background:rgba(18,19,20,.96);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px #000a;backdrop-filter:blur(28px);transform:translateY(110%);transition:transform .27s cubic-bezier(.2,.9,.2,1);max-height:90vh;overflow:auto}.sheet.open{transform:translateY(0)}
.numbers{display:flex;justify-content:space-between;padding:2px 6px 21px;font-size:10px;letter-spacing:1px;opacity:.87}.numbers strong{display:block;text-align:center;font-size:20px;letter-spacing:0;font-weight:500;padding-top:5px}.style-title{text-align:center;font-size:10px;letter-spacing:3px;color:#9c9c9c;margin-bottom:13px}
.presets{display:flex;overflow:auto;gap:8px;padding:0 3px 13px;scrollbar-width:none}.chip{min-width:97px;min-height:84px;border-radius:13px;border:1.5px solid transparent;position:relative;overflow:hidden;background:linear-gradient(130deg,#927a56,#343b51);display:flex;align-items:end;justify-content:center;padding:10px;font-size:10px;letter-spacing:.6px;font-weight:600;text-shadow:0 1px 5px #000c;flex-shrink:0}.chip.sel{border-color:#fff}.chip:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff1,transparent 50%,#0007);pointer-events:none}
.divider{height:1px;background:#ffffff20;margin:4px 3px 20px}.pad-label{display:flex;justify-content:space-between;font-size:11px;color:#a8a8a8;letter-spacing:1px;margin-bottom:12px}.pad{height:175px;position:relative;border:1px solid #ffffff1b;border-radius:16px;touch-action:none;overflow:hidden;background-color:#242627;background-image:radial-gradient(#ffffff4b 1.12px,transparent 1.3px);background-size:12px 12px;background-position:center}.pad:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;background:radial-gradient(ellipse at 50% 50%,transparent 40%,#0004 100%)}.dot{position:absolute;width:27px;height:27px;border-radius:50%;border:4px solid #fff;background:#fff3;box-shadow:0 0 0 5px #ffffff22,0 2px 12px #0009;transform:translate(-50%,-50%);pointer-events:none}
.palette-line{display:flex;align-items:center;gap:15px;margin:19px 0 10px;font-size:10px;letter-spacing:1.3px}.palette-line input{flex:1;accent-color:#e7e4dc;height:3px}.palette-line span{width:22px;text-align:right}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:22px}.actions button{border:1px solid #ffffff27;border-radius:30px;padding:11px 16px;letter-spacing:1px;font-size:10px}.actions .done{background:#e5e0d7;color:#191919;border:0;min-width:95px;font-weight:bold}
.toast{position:absolute;z-index:15;bottom:210px;left:50%;transform:translateX(-50%);background:#181818dd;color:white;border:1px solid #fff3;border-radius:40px;padding:10px 17px;white-space:nowrap;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media(max-height:700px){.header{flex-basis:43px}.dock{height:140px}.shoot{height:70px}.shutter{height:62px;width:62px}.sheet{padding-top:12px}.pad{height:120px}.chip{min-height:66px}.numbers{padding-bottom:11px}}
</style></head>
<body><div class="app">
  <div class="header"><button class="hdr-btn" id="flash">ϟ</button><div class="hdr-logo">◉ STYLECAM</div><button class="hdr-btn" id="grid">▦</button></div>
  <div class="view" id="view"><video id="vid" autoplay muted playsinline></video><canvas id="preview"></canvas><div class="gradient"></div>
    <div class="view-top">PHOTOGRAPHIC STYLES</div><div class="grid" id="gridlines"></div><div class="foc" id="focus"></div>
    <div class="offline" id="offline"><span style="font-size:56px">◎</span><b>Live camera preview</b><p id="offlineText">Allow camera access to use photographic styles.</p><button class="retry" id="retry">ENABLE CAMERA</button></div>
    <div class="look" id="look">AMBER</div><div class="zooms" id="zooms"><button data-z="1" class="sel">1×</button><button data-z="2">2×</button><button data-z="4">4×</button></div><button class="style-toggle" id="floating">◐</button>
  </div>
  <div class="dock"><div class="shoot"><button class="thumb" id="gallery">▧</button><button class="shutter" id="shutter"><div></div></button><button class="flip" id="flip">⟳</button></div><div class="mode"><span>VIDEO</span><span class="on">PHOTO</span></div><button class="style-open" id="showStyles"><span class="swatch"></span>PHOTOGRAPHIC STYLES⌃</button></div>
  <div class="sheet" id="sheet"><div class="numbers"><div>TONE<strong id="toneNumber">−40</strong></div><div>COLOR<strong id="colorNumber">100</strong></div><div>PALETTE<strong id="paletteNumber">61</strong></div></div><div class="style-title">UNDERTONES</div><div class="presets" id="presets"></div><div class="divider"></div><div class="pad-label"><span>TONE</span><span>COLOR</span></div><div class="pad" id="pad"><div class="dot" id="dot"></div></div><div class="palette-line"><label>PALETTE</label><input type="range" min="0" max="100" id="strength" value="61"><span id="strengthText">61</span></div><div class="actions"><button id="reset">↶ RESET</button><button id="close">✕ CLOSE</button><button class="done" id="done">DONE</button></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const looks=[
 {name:"STANDARD",x:0,y:0,p:0,rgb:"#5d6870"},
 {name:"AMBER",x:.7,y:-.4,p:61,rgb:"#a78047"},
 {name:"ROSE GOLD",x:.35,y:.1,p:65,rgb:"#b18b8f"},
 {name:"GOLD",x:.8,y:.12,p:70,rgb:"#cbb16e"},
 {name:"RICH CONTRAST",x:-.05,y:-.55,p:70,rgb:"#323a4d"},
 {name:"VIBRANT",x:.15,y:.2,p:82,rgb:"#6c8e81"},
 {name:"COOL",x:-.7,y:.15,p:60,rgb:"#6b889e"},
 {name:"NEUTRAL",x:0,y:.05,p:22,rgb:"#889292"},
 {name:"CINEMATIC",x:-.32,y:-.36,p:74,rgb:"#596c6d"}
];
let selected=1,x=.7,y=-.4,palette=61,zoom=1,facing="environment",stream=null,ready=false,gl=null,tex=null,program=null,uni={},fallback=null,lastWidth=0,lastHeight=0,grid=false,toastTimer=null;
const cv=$("preview"),video=$("vid"),offline=$("offline");
const vert="attribute vec2 p; varying vec2 uv; void main(){uv=(p+1.0)*0.5;gl_Position=vec4(p,0.0,1.0);}";
const frag="precision mediump float;varying vec2 uv;uniform sampler2D tex;uniform float X;uniform float Y;uniform float P;uniform float Z;uniform float A; void main(){vec2 coord=(uv-0.5)/Z+0.5;coord.x=coord.x; vec3 c=texture2D(tex,coord).rgb; float warm=X*P; c*=vec3(1.0+0.15*warm,1.0+0.024*warm,1.0-0.17*warm);float gamma=pow(2.0,-0.6*Y*P); c=pow(clamp(c,0.0,1.0),vec3(gamma));float contrast=1.0-0.33*Y*P;c=clamp(0.5+(c-0.5)*contrast,0.0,1.0);float l=dot(c,vec3(.299,.587,.114));float sat=1.0+0.32*P;c=clamp(vec3(l)+(c-vec3(l))*sat,0.0,1.0); if(A>0.5){c=clamp(c+vec3(0.0,-0.006,0.0),0.0,1.0);}gl_FragColor=vec4(c,1.0);}";
function shader(t,s){let o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
function initGL(){try{gl=cv.getContext("webgl",{alpha:false,preserveDrawingBuffer:true,antialias:false});if(!gl)throw new Error("WebGL unavailable"); program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error("Shader link failed");gl.useProgram(program);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let at=gl.getAttribLocation(program,"p");gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);Object.keys({X:0,Y:0,P:0,Z:0,A:0}).forEach(k=>uni[k]=gl.getUniformLocation(program,k));}catch(e){console.error(e);gl=null;fallback=cv.getContext("2d",{alpha:false});}}
function frame(){requestAnimationFrame(frame);if(!ready||video.readyState<2)return;let w=video.videoWidth||1280,h=video.videoHeight||720; if(w<10||h<10)return; if(w!==lastWidth||h!==lastHeight){lastWidth=w;lastHeight=h; let ratio=Math.min(1,1920/Math.max(w,h));cv.width=Math.max(1,Math.round(w*ratio));cv.height=Math.max(1,Math.round(h*ratio));if(gl)gl.viewport(0,0,cv.width,cv.height);}
try{if(gl){gl.useProgram(program);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);gl.uniform1f(uni.X,x);gl.uniform1f(uni.Y,y);gl.uniform1f(uni.P,palette/100);gl.uniform1f(uni.Z,zoom);gl.uniform1f(uni.A,selected===2?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}else if(fallback){fallback.save();fallback.filter="contrast("+(1-y*.2)+") saturate("+(1+palette*.004)+") sepia("+(Math.max(0,x)*palette/200)+")";fallback.drawImage(video,0,0,cv.width,cv.height);fallback.restore();}}
catch(e){console.warn("Camera render issue",e.message);}}
function toast(t){$("toast").textContent=t;$("toast").classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("on"),2600);}
function update(){ $("look").textContent=looks[selected].name;$("toneNumber").textContent=Math.round(y*100);$("colorNumber").textContent=Math.round(x*100);$("paletteNumber").textContent=palette;$("strength").value=palette;$("strengthText").textContent=palette;let d=$("dot");d.style.left=((x+1)*50)+"%";d.style.top=((1-y)*50)+"%";Array.from($("presets").children).forEach((b,i)=>b.classList.toggle("sel",i===selected));Array.from($("zooms").children).forEach(b=>b.classList.toggle("sel",Number(b.dataset.z)===zoom));try{localStorage.setItem("stylecam_look",JSON.stringify({selected,x,y,palette}));}catch(e){}}
function choose(i){selected=i;x=looks[i].x;y=looks[i].y;palette=looks[i].p;update();}
looks.forEach((look,i)=>{let b=document.createElement("button");b.className="chip";b.textContent=look.name;b.style.background="linear-gradient(145deg,"+look.rgb+",#111419)";b.onclick=()=>choose(i);$("presets").appendChild(b);});
function setPad(e){let r=$("pad").getBoundingClientRect();x=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));y=Math.max(-1,Math.min(1,1-(e.clientY-r.top)/r.height*2));update();}
$("pad").addEventListener("pointerdown",e=>{$("pad").setPointerCapture(e.pointerId);setPad(e)});$("pad").addEventListener("pointermove",e=>{if(e.buttons||e.pressure>0)setPad(e)});
$("strength").oninput=e=>{palette=Number(e.target.value);update()};
function open(){ $("sheet").classList.add("open");}function close(){$("sheet").classList.remove("open");}
$("showStyles").onclick=open;$("floating").onclick=open;$("close").onclick=close;$("done").onclick=close;$("reset").onclick=()=>choose(selected);
$("grid").onclick=()=>{grid=!grid;$("gridlines").classList.toggle("on",grid)};for(let i=0;i<9;i++)$("gridlines").appendChild(document.createElement("i"));
$("zooms").querySelectorAll("button").forEach(b=>b.onclick=()=>{zoom=Number(b.dataset.z);update()});
$("flip").onclick=()=>{facing=facing==="environment"?"user":"environment";startCamera();};
$("flash").onclick=()=>{const track=stream&&stream.getVideoTracks()[0];let caps=track&&track.getCapabilities?track.getCapabilities():null;if(!caps||!caps.torch){toast("Torch unavailable on this camera");return;}track.applyConstraints({advanced:[{torch:true}]}).then(()=>toast("Torch enabled")).catch(()=>toast("Torch unavailable"));};
$("shutter").onclick=()=>{if(!ready){toast("Enable camera first");return;}try{let jpeg=cv.toDataURL("image/jpeg",.94);if(window.Native&&typeof window.Native.savePhoto==="function")window.Native.savePhoto(jpeg);else{let a=document.createElement("a");a.href=jpeg;a.download="StyleCam_"+Date.now()+".jpg";a.click();toast("Photo exported");}}catch(e){toast("Could not capture image");}};
$("gallery").onclick=()=>{if(window.Native)window.Native.openGallery();else toast("Open your photo gallery");};
window.onSaved=(ok,msg)=>toast(msg);
async function startCamera(){ready=false;offline.style.display="flex";$("offlineText").textContent="Starting camera…";if(stream)stream.getTracks().forEach(t=>t.stop());try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error("Camera API unavailable in WebView");stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();ready=true;offline.style.display="none";}catch(e){console.error(e);$("offlineText").textContent=e.name==="NotAllowedError"?"Camera access denied. Allow permission in App Settings.":"Cannot start camera: "+e.message;offline.style.display="flex";}}
$("retry").onclick=startCamera;
let startX=0,startY=0;$("view").addEventListener("pointerdown",e=>{startX=e.clientX;startY=e.clientY});$("view").addEventListener("pointerup",e=>{let dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){choose((selected+(dx<0?1:-1)+looks.length)%looks.length)}else if(Math.abs(dx)<15&&Math.abs(dy)<15){let r=$("view").getBoundingClientRect(),f=$("focus");f.style.left=(e.clientX-r.left)+"px";f.style.top=(e.clientY-r.top)+"px";f.style.display="block";setTimeout(()=>f.style.display="none",700);}});
try{let last=JSON.parse(localStorage.getItem("stylecam_look"));if(last&&Number.isInteger(last.selected)&&last.selected>=0&&last.selected<looks.length){selected=last.selected;x=last.x;y=last.y;palette=last.palette;}}catch(e){}
update();initGL();requestAnimationFrame(frame);setTimeout(startCamera,220);
})();
</script></body></html>
